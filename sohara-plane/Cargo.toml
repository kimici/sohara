[package]
name = "sohara-plane"
version = "0.1.0"
edition = "2021"
description = "Control plane: registry, manager API, agent heartbeat/command API (D3)"

[dependencies]
anyhow = "1"
chrono = "0.4"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sohara-agent = { path = "../sohara-agent" }
sohara-triggers = { path = "../sohara-triggers" }

