[package]
name = "sohara-config"
version = "0.1.0"
edition = "2021"
description = "Declarative YAML flow schema, validation and pipeline building"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1"
sohara-core = { path = "../sohara-core" }
