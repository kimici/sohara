name: script
version: "1"
description: QuickJS 脚本步骤示例：inline 脚本 transform 为每条记录打标签
steps:
  - id: in
    kind: source
    type: file
    config: { path: data/input.csv, format: csv }
  - id: tag
    kind: transform
    type: script
    config:
      inline: |
        function transform(record, ctx) {
          record.bucket = record.age >= 18 ? 'adult' : 'minor';
          record.stamp = sohara.now();
          return record;
        }
  - id: out
    kind: sink
    type: file
    config: { path: output/scripted.jsonl, format: jsonl }
