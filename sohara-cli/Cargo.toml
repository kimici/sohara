[package]
name = "sohara-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line interface for Sohara flows"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sohara-core = { path = "../sohara-core" }
sohara-config = { path = "../sohara-config" }
sohara-builtins = { path = "../sohara-builtins" }
sohara-runtime = { path = "../sohara-runtime" }
sohara-triggers = { path = "../sohara-triggers" }
sohara-persistence = { path = "../sohara-persistence" }
sohara-io = { path = "../sohara-io" }
sohara-js = { path = "../sohara-js" }

[[bin]]
name = "sohara"
path = "src/main.rs"
