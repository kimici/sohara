[package]
name = "sohara-triggers"
version = "0.1.0"
edition = "2021"
description = "Event-driven triggers for serve mode: http / cron / queue"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
sohara-core = { path = "../sohara-core" }
sohara-config = { path = "../sohara-config" }
