[package]
name = "sohara-runtime"
version = "0.1.0"
edition = "2021"
description = "Flow graph builder and executor"

[dependencies]
async-trait = "0.1"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
sohara-core = { path = "../sohara-core" }
sohara-config = { path = "../sohara-config" }
sohara-triggers = { path = "../sohara-triggers" }

[dev-dependencies]
async-trait = "0.1"
sohara-builtins = { path = "../sohara-builtins" }
sohara-persistence = { path = "../sohara-persistence" }
