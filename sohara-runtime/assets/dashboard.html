<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sohara Dashboard</title>
<style>
  :root { --bg:#0f1420; --panel:#171d2c; --line:#2a3348; --text:#dde4f0; --dim:#8a94ad; --ok:#3ecf8e; --bad:#f0616d; --accent:#4d8df7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; }
  #paused-badge { font-size:12px; padding:3px 10px; border-radius:10px; background:var(--line); color:var(--dim); }
  #paused-badge.on { background:#7a2e2e; color:#ffd7d7; }
  main { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:14px; padding:14px 20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .panel h2 { font-size:14px; margin:0 0 10px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .cards { display:flex; flex-wrap:wrap; gap:10px; }
  .card { flex:1; min-width:110px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .card .k { font-size:11px; color:var(--dim); }
  .card .v { font-size:20px; font-weight:600; margin-top:2px; }
  .card .v.err { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 14px; cursor:pointer; font-size:13px; }
  button.secondary { background:var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  ul { list-style:none; padding:0; margin:0; font-size:13px; }
  li { padding:5px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  .dim { color:var(--dim); font-size:12px; }
  .mono { font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  .err-line { color:var(--bad); }
  pre { margin:0; white-space:pre-wrap; font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Sohara Dashboard</h1>
  <span id="paused-badge">running</span>
  <span class="dim" id="flow-name"></span>
  <span class="dim" id="run-id"></span>
  <span style="flex:1"></span>
  <button id="pause-btn">Pause</button>
  <button id="resume-btn" class="secondary">Resume</button>
</header>
<main>
  <section class="panel" id="overview">
    <h2>Overview</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section class="panel">
    <h2>Steps</h2>
    <table id="steps">
      <thead><tr><th>step</th><th>processed</th><th>filtered</th><th>errors</th><th>ms</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>Triggers</h2>
    <ul id="triggers"></ul>
  </section>

  <section class="panel">
    <h2>Approvals</h2>
    <ul id="approvals"><li class="dim">none</li></ul>
  </section>

  <section class="panel">
    <h2>Recent Errors</h2>
    <ul id="errors"><li class="dim">none</li></ul>
  </section>

  <section class="panel">
    <h2>Run History</h2>
    <table id="history">
      <thead><tr><th>status</th><th>flow</th><th>finished</th><th>proc</th><th>errors</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

async function toggle(kind) {
  const btn = kind === 'pause' ? $('pause-btn') : $('resume-btn');
  btn.disabled = true;
  try { await api(`/admin/${kind}`, { method: 'POST' }); } catch (e) { console.error(e); }
  btn.disabled = false;
  refresh();
}
$('pause-btn').onclick = () => toggle('pause');
$('resume-btn').onclick = () => toggle('resume');

function card(k, v, err) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="k">${k}</div><div class="v${err ? ' err' : ''}">${v}</div>`;
  return el;
}

async function refresh() {
  try {
    const s = await api('/admin/status');
    $('flow-name').textContent = `flow: ${s.flow}`;
    $('run-id').textContent = `run: ${s.run_id}`;
    const badge = $('paused-badge');
    badge.textContent = s.paused ? 'paused' : 'running';
    badge.className = s.paused ? 'on' : '';
    $('pause-btn').disabled = !!s.paused;
    $('resume-btn').disabled = !s.paused;

    const stats = s.stats;
    $('cards').replaceChildren(
      card('processed', stats.processed),
      card('filtered', stats.filtered),
      card('errors', stats.errors, stats.errors > 0),
      card('waiting', stats.waiting, stats.waiting > 0),
      card('duplicates', stats.duplicates),
      card('started', (s.started_at || '').slice(11, 19)),
    );

    const body = $('steps').querySelector('tbody');
    body.replaceChildren(...Object.entries(s.steps || {}).map(([id, st]) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${id}</td><td>${st.processed}</td><td>${st.filtered}</td>` +
        `<td>${st.errors}</td><td>${(st.nanos / 1e6).toFixed(1)}</td>`;
      return tr;
    }));

    $('triggers').replaceChildren(...(s.triggers || []).map((t) => {
      const li = document.createElement('li');
      li.textContent = `${t.kind}: ${t.id}`;
      return li;
    }));
    if (!(s.triggers || []).length) {
      $('triggers').replaceChildren(li('none'));
    }

    const approvals = await api('/admin/approvals');
    $('approvals').replaceChildren(...(approvals || []).map((a) => {
      const li = document.createElement('li');
      li.innerHTML = `<b>${a.step}</b> — ${a.count} parked`;
      if (a.sample != null) {
        li.appendChild(el('pre', JSON.stringify(a.sample, null, 2)));
      }
      return li;
    }));
    if (!(approvals || []).length) $('approvals').replaceChildren(li('none'));

    const errors = await api('/admin/errors');
    $('errors').replaceChildren(...(errors || []).map((e) => {
      const li = document.createElement('li');
      li.className = 'err-line';
      li.innerHTML = `<span class="dim">[${e.time.slice(11, 19)}] ${e.step} (${e.kind})</span><br>${e.message}`;
      return li;
    }));
    if (!(errors || []).length) $('errors').replaceChildren(li('none'));

    const history = await api('/admin/history');
    const hbody = $('history').querySelector('tbody');
    hbody.replaceChildren(...(history || []).map((h) => {
      const tr = document.createElement('tr');
      const st = h.stats || {};
      tr.innerHTML = `<td>${h.status}</td><td>${h.flow}</td>` +
        `<td>${(h.finished_at || '').slice(0, 19)}</td><td>${st.processed ?? 0}</td><td>${st.errors ?? 0}</td>`;
      return tr;
    }));
    if (!(history || []).length) hbody.replaceChildren(row('no history'));
  } catch (e) {
    console.error(e);
    $('flow-name').textContent = `error: ${e.message}`;
  }
}

function li(text) {
  const el = document.createElement('li');
  el.className = 'dim';
  el.textContent = text;
  return el;
}

function el(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}

function row(text) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = 5;
  td.className = 'dim';
  td.textContent = text;
  tr.appendChild(td);
  return tr;
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
