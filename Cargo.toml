[workspace]
members = [
    "sohara-core",
    "sohara-config",
    "sohara-builtins",
    "sohara-runtime",
    "sohara-triggers",
    "sohara-persistence",
    "sohara-io",
    "sohara-js",
    "sohara-cli",
    "sohara-agent",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A lightweight event-driven data processing framework"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# QuickJS
quick-js = "0.4"

# HTTP
axum = "0.7"
hyper = { version = "1", features = ["full"] }

# Cron
cron = "0.12"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls"] }

# Channels
crossbeam-channel = "0.5"
tokio-stream = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dashmap = "5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
